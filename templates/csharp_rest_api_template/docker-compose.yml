services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      API_TITLE: ${API_TITLE:-Csharp REST API Template}
      API_VERSION: ${API_VERSION:-1.0.0}
      API_DESCRIPTION: ${API_DESCRIPTION:-A template for building REST APIs with ASP.NET Core}
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - ./logs:/app/logs

  # PostgreSQL extension point:
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: template
  #     POSTGRES_USER: template
  #     POSTGRES_PASSWORD: change-me

  # Optional cache — enable REDIS_ENABLED=true in .env to use
  redis:
    image: redis:7-alpine
    container_name: csharp_rest_api_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data:
