services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: java_rest_api_template
    env_file: .env
    environment:
      HOST: ${HOST:-0.0.0.0}
      RELOAD: ${RELOAD:-false}
      WORKERS: ${WORKERS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_TITLE: ${API_TITLE:-Java REST API Template}
      API_VERSION: ${API_VERSION:-1.0.0}
      API_DESCRIPTION: ${API_DESCRIPTION:-A template for building REST APIs with Spring Boot}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs  # Persist logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional cache — enable REDIS_ENABLED=true in .env to use
  redis:
    image: redis:7-alpine
    container_name: java_rest_api_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

